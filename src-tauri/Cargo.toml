[package]
name = "joymanga"
version = "0.3.4"
default-run = "joymanga"
description = "JoyManga 漫画下载与本地阅读工具，支持任务恢复、CBZ 导入与批量导出"
authors = ["Beyondoooars"]
license = "MIT"
repository = "https://github.com/Beyondoooars/JoyManga"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "joymanga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
yaserde = { version = "0.12.0", features = ["yaserde_derive"] }

specta = { version = "2.0.0-rc", features = ["serde_json"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta-typescript = { version = "0.0.7" }

reqwest = { version = "0.12.15", default-features = false, features = ["json", "cookies", "rustls-tls"] }
reqwest-retry = { version = "0.6.1" }
reqwest-middleware = { version = "0.3.3 " }

base64 = { version = "0.22" }
percent-encoding = { version = "2.3.1" }
md5 = { version = "0.7.0" }
aes = { version = "0.8.4" }

anyhow = { version = "1" }
tokio = { version = "1.40.0", features = ["full"] }
bytes = { version = "1.7.2" }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
parking_lot = { version = "0.12.3", features = ["send_guard"] }
rayon = { version = "1.10.0" }
uuid = { version = "1.15.1", features = ["v4"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["json", "time", "local-time"] }
tracing-appender = { version = "0.2.3" }
notify = { version = "8.0.0" }
walkdir = { version = "2.5.0" }
indexmap = { version = "2.10.0", features = ["serde"] }
ring = "0.17"
# 简繁转换：纯 Rust + 内嵌 OpenCC 词典（词典为 Apache-2.0，见 THIRD_PARTY_NOTICES.md）
opencc-fmmseg = { version = "=0.13.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[features]
bindings = []

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]
