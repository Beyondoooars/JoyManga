<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- https: 与 http://jmimg.localhost 仅为让封面/书页请求进入 tests/mock-sw.js 由本地生成，不会真正联网 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: blob: https: http://jmimg.localhost; connect-src 'self' ws:;" />
    <title>下载器界面测试（模拟数据）</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 在 Vue/Tauri 模块执行前安装测试桩，不继承或修改真实 WebView IPC。
      // 回调与事件监听表按 Tauri 2 的注入脚本建模：回调存 Map，事件表为 event -> eventId。
      const callbacks = new Map()
      function unregisterCallback(id) {
        callbacks.delete(id)
        delete window[`_${id}`]
      }
      window.__TAURI_INTERNALS__ = {
        invoke: (command, args) => window.__uiFixtureInvoke(command, args),
        metadata: {
          currentWindow: { label: 'main' },
          currentWebview: { windowLabel: 'main', label: 'main' },
        },
        transformCallback: (callback, once = false) => {
          const id = window.crypto.getRandomValues(new Uint32Array(1))[0]
          const run = (data) => {
            if (once) unregisterCallback(id)
            return callback?.(data)
          }
          window[`_${id}`] = run
          callbacks.set(id, run)
          return id
        },
        unregisterCallback,
        runCallback: (id, data) => {
          const callback = callbacks.get(id)
          if (callback) callback(data)
          else console.warn(`[TAURI] Couldn't find callback id ${id}.`)
        },
        callbacks,
      }
      // 对应真实 Tauri 的 __internal_unstable_listeners_object_id__：event -> eventId -> { handlerId }
      window.__TAURI_EVENT_LISTENERS__ = Object.create(null)
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: (event, eventId) => {
          const eventListeners = window.__TAURI_EVENT_LISTENERS__[event]
          const listener = eventListeners?.[eventId]
          if (!listener) return
          window.__TAURI_INTERNALS__.unregisterCallback(listener.handlerId)
          delete eventListeners[eventId]
        },
      }
    </script>
    <script type="module" src="/tests/ui.mjs"></script>
  </body>
</html>
