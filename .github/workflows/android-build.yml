name: Android Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本递增方式：patch / minor / major，或明确的 X.Y.Z'
        required: false
        default: patch
  push:
    branches:
      - main
      - 'agent/**'
      - 'milestone/**'
    tags:
      - 'v*'

# 主分支构建会把新版本号写回 main，并发运行会互相覆盖；串行执行且不取消已在跑的构建，
# 避免一次发布被打断。
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 版本号提交与打标签需要完整历史；main 上始终基于最新提交，
          # 避免连续推送时两个构建各自从旧提交递增出同一个版本号。
          fetch-depth: 0
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and SDK
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then
              echo "$d" >> $GITHUB_PATH
              export PATH="$d:$PATH"
              break
            fi
          done
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME"/ndk 2>/dev/null)" ]; then
            echo "Installing NDK..."
            sdkmanager "ndk;26.1.10909125"
          fi

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # 主分支与手动触发的构建自动递增版本号：无需本地执行 pnpm bump 再手动提交。
      # 里程碑合入 main 时，在提交信息末尾加一行 Release-Bump: minor（或 major）；
      # 其余 main 推送按 patch 递增（只用于修复）。用 trailer 而不是方括号标记，
      # 避免提交说明里提到标记本身时被误判。
      - name: Determine version bump
        id: bump
        if: github.ref == 'refs/heads/main'
        run: |
          bump=$(git log -1 --pretty=%B | sed -nE 's/^Release-Bump:[[:space:]]*(minor|major)[[:space:]]*$/\1/p' | tail -n 1)
          echo "bump=${bump:-patch}" >> "$GITHUB_OUTPUT"

      # agent / milestone 分支与打 tag 的构建保持仓库里已有的版本号，不重复递增。
      - name: Bump version
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ github.event.inputs.version || steps.bump.outputs.bump || 'patch' }}
        run: node scripts/bump-version.mjs "$BUMP"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android Project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          fi

      - name: Extract version info
        id: version_info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tag 构建以 tag 为准：手工补发的 tag 可能指向尚未更新版本号的提交
            VERSION="${GITHUB_REF#refs/tags/v}"
            node scripts/bump-version.mjs "$VERSION" > /dev/null
          else
            # main 上由上一步自动递增；agent / milestone 分支沿用仓库里已有的版本号
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$CERT_SHA256"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.keystore

      - name: Build Android APK
        env:
          APP_VERSION_NAME: ${{ env.VERSION }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect and verify signed APK
        env:
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' ! -name '*unsigned*' | sort)
          test "${#apks[@]}" -eq 1
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "${apks[0]}" > artifacts/signature.txt
          actual=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}' artifacts/signature.txt | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          expected=$(printf '%s' "$CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test -n "$actual" && test "$actual" = "$expected"
          "$build_tools/aapt" dump badging "${apks[0]}" > artifacts/package.txt
          grep -F "versionName='$VERSION'" artifacts/package.txt
          grep -F "native-code: 'arm64-v8a'" artifacts/package.txt
          cp "${apks[0]}" artifacts/joymanga-arm64-v8a.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: joymanga-android-arm64-v8a-apk
          path: artifacts/joymanga-arm64-v8a.apk
          if-no-files-found: error

      # APK 校验通过后再把版本号写回 main：构建失败时仓库里不会留下一个没有产物的版本号。
      # 用 GITHUB_TOKEN 推送不会再触发工作流，`[skip ci]` 只是额外保险。
      # 非 main 分支（含手动触发的预构建）不回写，避免把测试版本号提交进仓库。
      - name: Commit and push version bump
        id: bump_commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock README.md
          # 显式发布版本号时文件可能本来就是这个值，仍需一次提交作为 tag 的落点
          git commit --allow-empty -m "chore: 发布 v${VERSION} [skip ci]"
          # 构建过程可能在工作区留下未暂存改动（tauri 会给 gradlew 补可执行位等），
          # 而 git pull --rebase 要求工作区干净：拉取时必须自动暂存，否则重试一次都跑不完。
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "版本号提交推送失败" >&2
              exit 1
            fi
            if ! git -c rebase.autoStash=true pull --rebase origin main; then
              echo "第 ${attempt} 次同步 origin/main 失败，当前工作区：" >&2
              git status --short >&2 || true
              exit 1
            fi
          done
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # 发布说明从上一个版本 tag 到本次的提交里生成，按新功能/修复/优化分组。
      # 不用 generate_release_notes：它只列 PR，本项目直接推 main，生成的正文几乎是空的。
      - name: Generate release notes
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "$VERSION" release-notes.md

      # 每次 main 构建（含手动触发）都发布 Release：应用内更新依赖它发现新版本。
      # agent / milestone 分支只产出构建产物，不发布。
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          # main 上 tag 指向版本号提交；tag 构建沿用该 tag 自身的提交
          target_commitish: ${{ steps.bump_commit.outputs.SHA || github.sha }}
          name: JoyManga v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            artifacts/joymanga-arm64-v8a.apk
          draft: false
          prerelease: false
