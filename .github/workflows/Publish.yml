name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version number
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  windows-build:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    outputs:
      VERSION: ${{ env.VERSION }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy nsis to release assets
        run: cp src-tauri/target/release/bundle/nsis/joymanga_${{ env.VERSION }}_x64-setup.exe artifacts/joymanga_${{ env.VERSION }}_windows_x64.exe

      - name: Zip portable to release assets
        run: |
          cd src-tauri/target/release
          7z a -tzip ../../../artifacts/joymanga_${{ env.VERSION }}_windows_x64_portable.zip joymanga.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: artifacts/*

  android-build:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    outputs:
      VERSION: ${{ env.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and SDK
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then
              echo "$d" >> $GITHUB_PATH
              export PATH="$d:$PATH"
              break
            fi
          done
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME"/ndk 2>/dev/null)" ]; then
            echo "Installing NDK..."
            sdkmanager "ndk;26.1.10909125"
          fi

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android Project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          fi

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect Android APKs
        run: |
          mkdir -p artifacts
          # 收集 arm64-v8a apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*release*.apk" -exec cp {} artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk \;
          # 兜底如果名称不同，保留 .apk
          if [ ! -f artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk ]; then
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk \;
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: artifacts/*

  linux-build:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    outputs:
      VERSION: ${{ env.VERSION }}
    runs-on: ubuntu-22.04
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy deb to release assets
        run: cp src-tauri/target/release/bundle/deb/joymanga_${{ env.VERSION }}_amd64.deb artifacts/joymanga_${{ env.VERSION }}_linux_amd64.deb

      - name: Copy rpm to release assets
        run: cp src-tauri/target/release/bundle/rpm/joymanga-${{ env.VERSION }}-1.x86_64.rpm artifacts/joymanga_${{ env.VERSION }}_linux_amd64.rpm

      - name: Zip portable to release assets
        run: |
          cd src-tauri/target/release
          tar -czf ../../../artifacts/joymanga_${{ env.VERSION }}_linux_amd64_portable.tar.gz joymanga

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: artifacts/*

  macos-build:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    outputs:
      VERSION: ${{ env.VERSION }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.arch }}-apple-darwin

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Copy dmg to release assets
        env:
          ARCH_ALIAS: ${{ matrix.arch == 'x86_64' && 'x64' || matrix.arch }}
        run: cp src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/dmg/joymanga_${{ env.VERSION }}_${{ env.ARCH_ALIAS }}.dmg artifacts/joymanga_${{ env.VERSION }}_macos_${{ matrix.arch }}.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets-${{ matrix.arch }}
          path: artifacts/*

  create-release:
    needs: [windows-build, android-build, linux-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: artifacts/windows

      - name: Download Android assets
        uses: actions/download-artifact@v4
        with:
          name: android-assets
          path: artifacts/android

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: artifacts/linux

      - name: Download macOS aarch64 assets
        uses: actions/download-artifact@v4
        with:
          name: macos-assets-aarch64
          path: artifacts/macos-aarch64

      - name: Download macOS x86_64 assets
        uses: actions/download-artifact@v4
        with:
          name: macos-assets-x86_64
          path: artifacts/macos-x86_64

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: JoyManga v${{ needs.windows-build.outputs.VERSION }}
          body: |
            ### JoyManga v${{ needs.windows-build.outputs.VERSION }}
            欢迎下载使用！本版本支持 Windows 免安装便携版、Android APK、Linux 及 macOS。
          files: |
            artifacts/windows/*
            artifacts/android/*
            artifacts/linux/*
            artifacts/macos-aarch64/*
            artifacts/macos-x86_64/*
          draft: false
          prerelease: false
