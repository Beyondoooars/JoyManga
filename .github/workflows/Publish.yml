name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version number
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  android-build:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    outputs:
      VERSION: ${{ env.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and SDK
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then
              echo "$d" >> $GITHUB_PATH
              export PATH="$d:$PATH"
              break
            fi
          done
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME"/ndk 2>/dev/null)" ]; then
            echo "Installing NDK..."
            sdkmanager "ndk;26.1.10909125"
          fi

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android Project if needed
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          fi

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect Android APKs
        run: |
          mkdir -p artifacts
          # 收集 arm64-v8a apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*release*.apk" -exec cp {} artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk \;
          # 兜底如果名称不同，保留 .apk
          if [ ! -f artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk ]; then
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/joymanga_${{ env.VERSION }}_android_arm64-v8a.apk \;
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: artifacts/*

  create-release:
    needs: [android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android assets
        uses: actions/download-artifact@v4
        with:
          name: android-assets
          path: artifacts/android

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: JoyManga v${{ needs.android-build.outputs.VERSION }}
          body: |
            ### JoyManga v${{ needs.android-build.outputs.VERSION }}
            欢迎下载使用！本版本提供 Android arm64-v8a APK。
          files: |
            artifacts/android/*
          draft: false
          prerelease: false
