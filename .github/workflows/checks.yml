name: checks

# 可复用的检查集合：PR 由 CI.yml 调用，main / 分支推送与手动打包由 Android Build
# 在打包前调用。两处共用同一份定义，避免 PR、发版前的检查标准漂移。
# 本地对应命令是 `pnpm check`（见 package.json 与 .githooks/pre-push）。
on:
  workflow_call:
    inputs:
      android-check:
        description: 是否执行 Android target 的 cargo check
        type: boolean
        default: true

# 检查只读代码，不需要写权限；调用方（Android Build）的写权限不会被它继承使用。
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  # 桌面 clippy 不会编译 `#[cfg(target_os = "android")]` 分支。v0.3.11 后的清理
  # 删掉了只有 Android 分支调用的函数，PR 检查全绿，main 的 Android Build 才报 E0425。
  # 这里用与打包相同的 NDK 和 target 做一次 cargo check，让此类错误在 PR 阶段暴露。
  rust-android:
    if: ${{ inputs['android-check'] }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then
              echo "$d" >> "$GITHUB_PATH"
              export PATH="$d:$PATH"
              break
            fi
          done
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # 与 android-build.yml 固定同一版本，避免检查与打包使用不同的编译器。
          NDK_VERSION="29.0.14206865"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            sdkmanager "ndk;$NDK_VERSION"
          fi
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          {
            echo "NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android$API-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android$API-clang"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-ndk-29

      - run: cargo check --target aarch64-linux-android
